name: PRISM v4.62 Recovery 50 200
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/recovery_50200_v462.py'
      - '.github/workflows/prism-v462.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Run Recovery 50 200 entry and stop comparison
        run: python -m prism.recovery_50200_v462
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v462
          test -f results/prism-v462/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v462/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v462-recovery-50200
          path: results/prism-v462/
          if-no-files-found: error
