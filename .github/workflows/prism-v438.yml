name: PRISM v4.38 Unified Exit Audit
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/unified_exit_v438.py'
      - '.github/workflows/prism-v438.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild frozen VCP80 signals
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
      - name: Run exit-engine consistency audit
        run: python -m prism.unified_exit_v438
      - name: Failure diagnostic
        if: always()
        run: |
          mkdir -p results/prism-v438
          test -f results/prism-v438/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v438/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v438-unified-exit
          path: results/prism-v438/
          if-no-files-found: error
