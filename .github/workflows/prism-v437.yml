name: PRISM v4.37 Adaptive Robustness
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/robustness_v437.py'
      - '.github/workflows/prism-v437.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild VCP80 and regime adaptive strategies
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
      - name: Audit concentration and stress
        run: python -m prism.robustness_v437
      - name: Diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v437
          test -f results/prism-v437/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v437/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v437-adaptive-robustness
          path: results/prism-v437/
          if-no-files-found: error
