name: PRISM v4.42 Independent Seed B Discovery
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/seed_b_discovery_v442.py'
      - '.github/workflows/prism-v442.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild frozen Seed A and VCP control
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
      - name: Discover and replay independent Seed B signals
        run: python -m prism.seed_b_discovery_v442
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v442
          test -f results/prism-v442/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v442/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v442-seed-b-discovery
          path: results/prism-v442/
          if-no-files-found: error
