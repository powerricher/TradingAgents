name: PRISM v4.47 Historical Catalyst Evidence
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/catalyst_evidence_v447.py'
      - '.github/workflows/prism-v447.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy requests
      - name: Rebuild historical candidates
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
          python -m prism.seed_b_v445
      - name: Discover historical SEC filing evidence
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m prism.catalyst_evidence_v447
      - name: Diagnostic artifact
        if: always()
        run: |
          mkdir -p results/prism-v447
          test -f results/prism-v447/summary.json || echo '{"status":"FAILED","see":"job logs"}' > results/prism-v447/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v447-catalyst-evidence
          path: results/prism-v447/
          if-no-files-found: error
