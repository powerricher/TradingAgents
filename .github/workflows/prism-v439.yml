name: PRISM v4.39 Dual Seed
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/dual_seed_v439.py'
      - '.github/workflows/prism-v439.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild frozen VCP80 signals
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
      - name: Build MA30 and ATR4 controls
        run: python -m prism.regime_adaptive_v436
      - name: Build unified adaptive fixed exit
        run: python -m prism.unified_exit_v438
      - name: Combine independent seed equity curves
        run: python -m prism.dual_seed_v439
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v439
          test -f results/prism-v439/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v439/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v439-dual-seed
          path: results/prism-v439/
          if-no-files-found: error
