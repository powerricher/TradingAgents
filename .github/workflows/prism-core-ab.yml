name: PRISM Core A-B
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy requests
      - name: Rebuild Seed A and Seed B core audit
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.atr_frontier_v433
          python -m prism.regime_adaptive_v436
          python -m prism.seed_b_v445
          python -m prism.technical_quality_v450
          python -m prism.strategy_consolidation_v457
          python -m prism.core_audit_v463
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-core-ab-audit
          path: results/prism-v463/
          if-no-files-found: warn
