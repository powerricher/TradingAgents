name: PRISM v4.51 Quality Calibration
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/quality_calibration_v451.py'
      - '.github/workflows/prism-v451.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild TECH150 and v4.50 quality score
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
          python -m prism.seed_b_v445
          python -m prism.technical_quality_v450
      - name: Evaluate D+5 D+10 D+20 calibration and missed opportunities
        run: python -m prism.quality_calibration_v451
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v451
          test -f results/prism-v451/summary.json || echo '{"status":"FAILED","see":"job logs"}' > results/prism-v451/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v451-quality-calibration
          path: results/prism-v451/
          if-no-files-found: error
