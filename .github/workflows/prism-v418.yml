name: PRISM v4.18 Ranking Robustness
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/robustness_v418.py'
      - '.github/workflows/prism-v418.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild 80-stock signals
        run: python -m prism.entry_v413
      - name: Rebuild MA30 trades
        run: python -m prism.replay_v414
      - name: Rebuild chronological Ridge ranker
        run: python -m prism.ranking_v417
      - name: Audit concentration and costs
        run: python -m prism.robustness_v418
      - name: Diagnostic on failure
        if: always()
        run: |
          mkdir -p results/prism-v418
          test -f results/prism-v418/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v418/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v418-ranking-robustness
          path: |
            results/prism-v418/
            results/prism-v417/summary.json
          if-no-files-found: error
