name: PRISM v4.33 ATR Frontier Audit
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/atr_frontier_v433.py'
      - '.github/workflows/prism-v433.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild frozen VCP80 signals
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
      - name: Evaluate monotone ATR frontier
        run: python -m prism.atr_frontier_v433
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v433
          test -f results/prism-v433/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v433/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v433-atr-frontier
          path: results/prism-v433/
          if-no-files-found: error
