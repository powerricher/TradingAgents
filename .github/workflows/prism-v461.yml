name: PRISM v4.61 Trend Type Audit
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/trend_type_v461.py'
      - '.github/workflows/prism-v461.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild frozen Seed A/B inputs and high proximity
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
          python -m prism.seed_b_v445
          python -m prism.technical_quality_v450
          python -m prism.strategy_consolidation_v457
          python -m prism.seed_ab_audit_v459
          python -m prism.high_proximity_v460
      - name: Classify continuation transition and mixed signals
        run: python -m prism.trend_type_v461
      - name: Preserve failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v461
          test -f results/prism-v461/summary.json || echo '{"status":"FAILED","see":"job logs"}' > results/prism-v461/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v461-trend-type-audit
          path: results/prism-v461/
          if-no-files-found: error
