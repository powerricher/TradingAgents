name: PRISM v4.63 Core Strategy Audit
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/core_audit_v463.py'
      - '.github/workflows/prism-v463.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild frozen Seed A and B inputs
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.atr_frontier_v433
          python -m prism.regime_adaptive_v436
          python -m prism.seed_b_v445
          python -m prism.technical_quality_v450
          python -m prism.strategy_consolidation_v457
      - name: Audit core strategy trade ledgers
        run: python -m prism.core_audit_v463
      - name: Upload report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-v463-core-strategy-audit
          path: results/prism-v463/
          if-no-files-found: error
