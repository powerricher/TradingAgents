name: PRISM v4.45 TECH150 Seed B
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/universe_v445.py'
      - 'prism/seed_b_v445.py'
      - '.github/workflows/prism-v445.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Validate 150 distinct symbols
        run: python -c "from prism.universe_v445 import UNIVERSE; assert len(UNIVERSE)==150 and len(set(UNIVERSE))==150"
      - name: Rebuild frozen Seed A ATR4
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
      - name: Run 80 100 150 comparisons
        run: python -m prism.seed_b_v445
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v445
          test -f results/prism-v445/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v445/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v445-tech150-seed-b
          path: results/prism-v445/
          if-no-files-found: error
