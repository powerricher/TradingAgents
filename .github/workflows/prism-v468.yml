name: PRISM v4.68 Seed C Exit Accuracy
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/seed_c_execution_v468.py'
      - '.github/workflows/prism-v468.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy requests
      - name: Rebuild v4.67 frozen signal discovery
        run: python -m prism.seed_c_discovery_v467
      - name: Simulate 27 exit combinations with same-day stop protection
        run: python -m prism.seed_c_execution_v468
      - name: Diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v468
          test -f results/prism-v468/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v468/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v468-seed-c-execution
          path: |
            results/prism-v468/
            results/prism-v467/summary.json
          if-no-files-found: error
