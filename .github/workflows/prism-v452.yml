name: PRISM v4.52 Long Formation Patterns
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/long_patterns_v452.py'
      - '.github/workflows/prism-v452.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild frozen Seed A ATR4
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
      - name: Discover 150-session triangles and wedges
        run: python -m prism.long_patterns_v452
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v452
          test -f results/prism-v452/summary.json || echo '{"status":"FAILED","see":"job logs"}' > results/prism-v452/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v452-long-patterns
          path: results/prism-v452/
          if-no-files-found: error
