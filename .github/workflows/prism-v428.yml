name: PRISM v4.28 Selection Error Audit
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/audit_v428.py'
      - '.github/workflows/prism-v428.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - run: python -m prism.entry_v413
      - run: python -m prism.replay_v414
      - run: python -m prism.ranking_v417
      - run: python -m prism.price_action_v419
      - run: python -m prism.vcp_v420
      - run: python -m prism.asymmetric_v427
      - name: Audit selection mistakes and early exits
        run: python -m prism.audit_v428
      - name: Failure diagnostic
        if: always()
        run: |
          mkdir -p results/prism-v428
          test -f results/prism-v428/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v428/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v428-selection-error-audit
          path: results/prism-v428/
          if-no-files-found: error
