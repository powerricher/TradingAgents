name: PRISM v4.69 C1 Entry Audit
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/seed_c_entry_audit_v469.py'
      - '.github/workflows/prism-v469.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy requests
      - name: Rebuild C1 historical reference
        run: |
          python -m prism.seed_c_discovery_v467
          python -m prism.seed_c_execution_v468
      - name: Audit frozen C1 trades and failure mechanisms
        run: python -m prism.seed_c_entry_audit_v469
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-v469-c1-entry-audit
          path: results/prism-v469/
          if-no-files-found: error
