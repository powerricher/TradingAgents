name: PRISM v4.9 Confirmed Trend Auto
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/trend_v49.py'
      - '.github/workflows/prism-v49.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Generate frozen baseline signals
        run: python -m prism.v45_cli
      - name: Compare confirmed trend exits
        run: python -m prism.trend_v49
      - name: Ensure diagnostic artifact
        if: always()
        run: |
          mkdir -p results/prism-v49
          test -f results/prism-v49/summary.json || echo '{"status":"FAILED","note":"Review workflow logs"}' > results/prism-v49/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v49-confirmed-trend
          path: results/prism-v49/
          if-no-files-found: error
