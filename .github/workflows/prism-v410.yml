name: PRISM v4.10 MA Robustness Auto
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/robustness_v410.py'
      - '.github/workflows/prism-v410.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild frozen entry signals
        run: python -m prism.v45_cli
      - name: Compare MA 25 30 35 40
        run: python -m prism.robustness_v410
      - name: Diagnostic
        if: always()
        run: |
          mkdir -p results/prism-v410
          test -f results/prism-v410/summary.json || echo '{"status":"FAILED","see":"job logs"}' > results/prism-v410/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v410-ma-robustness
          path: results/prism-v410/
          if-no-files-found: error
