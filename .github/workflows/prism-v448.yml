name: PRISM v4.48 Multi-Source Catalyst
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/catalyst_multisource_v448.py'
      - '.github/workflows/prism-v448.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy requests
      - name: Rebuild v4.45 candidates and v4.47 targets
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
          python -m prism.seed_b_v445
          python -m prism.catalyst_evidence_v447
      - name: Collect independent source evidence
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m prism.catalyst_multisource_v448
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v448
          test -f results/prism-v448/summary.json || echo '{"status":"FAILED","see":"job logs"}' > results/prism-v448/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v448-multisource-catalyst
          path: results/prism-v448/
          if-no-files-found: error
