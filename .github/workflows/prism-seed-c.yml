name: PRISM Seed C
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prism-seed-c.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy requests
      - name: Build C1 frozen signals and exit reference
        run: |
          python -m prism.seed_c_discovery_v467
          python -m prism.seed_c_execution_v468
      - name: Rebuild C1 multi-position baseline v4.71
        run: python -m prism.seed_c_multi_position_v471
      - name: Rebuild C1 expansion reference v4.73
        run: python -m prism.seed_c_signal_expansion_v473
      - name: Rebuild expanded C1 quality ranking v4.74
        run: python -m prism.seed_c_quality_selection_v474
      # Re-run v4.75 with the same research rules; no strategy changes.
      - name: Audit C1 historical robustness v4.75
        run: python -m prism.seed_c_robustness_v475
      # v4.76 baseline replay preserves original BASE edge and string date keys.
      - name: Evaluate regime-gated C1 challenger v4.76
        run: python -m prism.seed_c_regime_gate_v476
      - name: Rebuild Seed A/B reference for v4.77
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.atr_frontier_v433
          python -m prism.regime_adaptive_v436
          python -m prism.seed_b_v445
          python -m prism.technical_quality_v450
          python -m prism.strategy_consolidation_v457
      - name: Audit independent A/B/C sleeves v4.77
        run: python -m prism.seed_abc_audit_v477
      - name: Evaluate lagged ABC capital allocation v4.78
        run: python -m prism.seed_abc_allocation_v478
      - name: Explore C4 sequential moving-average reclaim
        run: python -m prism.seed_c_ma_reclaim_c4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-seed-abc-v478
          path: |
            results/prism-v476/
            results/prism-v477/
            results/prism-v478/
            results/prism-c4-ma-reclaim/
          if-no-files-found: error
