name: PRISM Seed C
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prism-seed-c.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy requests
      - name: Build C1 frozen signals and exit reference
        run: |
          python -m prism.seed_c_discovery_v467
          python -m prism.seed_c_execution_v468
      - name: Rebuild C1 multi-position baseline v4.71
        run: python -m prism.seed_c_multi_position_v471
      - name: Compare C1 isolated signal expansions v4.73
        run: python -m prism.seed_c_signal_expansion_v473
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-seed-c-v473
          path: results/prism-v473/
          if-no-files-found: error
