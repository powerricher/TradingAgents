name: PRISM Seed C
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy requests
      - name: Build C1 frozen signals and exit reference
        run: |
          python -m prism.seed_c_discovery_v467
          python -m prism.seed_c_execution_v468
      - name: Run C1 regime and sizing audit v4.70
        run: python -m prism.seed_c_regime_risk_v470
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-seed-c-v470
          path: results/prism-v470/
          if-no-files-found: warn
