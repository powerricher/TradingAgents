name: PRISM v4.85 A-B Quality
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prism-ab-quality.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy requests
      - name: Rebuild frozen A/B baselines
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.atr_frontier_v433
          python -m prism.regime_adaptive_v436
          python -m prism.seed_b_v445
          python -m prism.technical_quality_v450
          python -m prism.strategy_consolidation_v457
      - name: Audit A/B concentration and annual performance v4.85
        run: python -m prism.seed_ab_quality_v485
      - name: Analyze A/B trade fragility v4.86
        run: python -m prism.seed_ab_fragility_v486
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-ab-v486
          path: |
            results/prism-v485/
            results/prism-v486/
          if-no-files-found: error
