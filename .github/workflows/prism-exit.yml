name: PRISM Exit Strategy Comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install . scikit-learn
      - name: Reproduce frozen entries
        run: python -m prism.rolling_v42_cli "NVDA,AAPL,MSFT,AMZN,GOOGL,META,AVGO,TSLA,NFLX,AMD,ORCL,PLTR,CSCO,IBM,INTC,QCOM,TXN,AMAT,LRCX,MU,ARM,CRWD,PANW,ADBE,NOW,SHOP,UBER,ABNB,COIN,HOOD" --top-pct 0.10 --uncertainty-penalty 0.35
      - name: Compare exits
        run: python -m prism.exit_compare --source results/prism-v42/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: prism-exit-comparison
          path: results/prism-exit/
