name: PRISM v4.50 Technical Entry Quality
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/technical_quality_v450.py'
      - '.github/workflows/prism-v450.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild historical candidate baseline
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
          python -m prism.seed_b_v445
      - name: Run entry quality comparison
        run: python -m prism.technical_quality_v450
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v450
          test -f results/prism-v450/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v450/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v450-technical-entry-quality
          path: results/prism-v450/
          if-no-files-found: error
