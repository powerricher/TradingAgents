name: PRISM v4.17 MA30 Ranking Challenger
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/ranking_v417.py'
      - '.github/workflows/prism-v417.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild frozen TECH80 signals
        run: python -m prism.entry_v413
      - name: Rebuild fixed MA30 exits
        run: python -m prism.replay_v414
      - name: Chronological MA30-aligned ranking test
        run: python -m prism.ranking_v417
      - name: Diagnostic on failure
        if: always()
        run: |
          mkdir -p results/prism-v417
          test -f results/prism-v417/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v417/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v417-ranking-challenger
          path: results/prism-v417/
          if-no-files-found: error
