name: PRISM v4.35 Market Regime Attribution
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/regime_audit_v435.py'
      - '.github/workflows/prism-v435.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild VCP80 and ATR4 equity
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.atr_risk_v434
      - name: Attribute QQQ bull bear sideways regimes
        run: python -m prism.regime_audit_v435
      - name: Failure diagnostic
        if: always()
        run: |
          mkdir -p results/prism-v435
          test -f results/prism-v435/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v435/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v435-market-regime
          path: results/prism-v435/
          if-no-files-found: error
