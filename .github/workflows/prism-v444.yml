name: PRISM v4.44 BCH Robustness Regime
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/seed_b_v444.py'
      - '.github/workflows/prism-v444.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild Seed A and independent Seed B discoveries
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
          python -m prism.seed_b_discovery_v442
          python -m prism.seed_b_v443
      - name: Evaluate BCH robustness and regime attribution
        run: python -m prism.seed_b_v444
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v444
          test -f results/prism-v444/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v444/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v444-bch-robustness
          path: results/prism-v444/
          if-no-files-found: error
