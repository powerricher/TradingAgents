name: PRISM v4.64 TECH200 Expansion
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/universe_v464.py'
      - 'prism/tech200_expansion_v464.py'
      - '.github/workflows/prism-v464.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Verify 200 unique symbols
        run: python -c "from prism.universe_v464 import UNIVERSE; assert len(UNIVERSE)==len(set(UNIVERSE))==200"
      - name: Rebuild frozen Seed A
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
      - name: Compare TECH150 and TECH200 Breakout
        run: python -m prism.tech200_expansion_v464
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v464
          test -f results/prism-v464/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v464/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v464-tech200-expansion
          path: results/prism-v464/
          if-no-files-found: error
