name: PRISM v4.67 Seed C Discovery
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/seed_c_discovery_v467.py'
      - '.github/workflows/prism-v467.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy requests
      - name: Run 1000-name Seed C independent signal discovery
        run: python -m prism.seed_c_discovery_v467
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v467
          test -f results/prism-v467/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v467/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v467-seed-c-discovery
          path: results/prism-v467/
          if-no-files-found: error
