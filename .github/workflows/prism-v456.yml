name: PRISM v4.56 Structural Reversal
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/structural_reversal_v456.py'
      - '.github/workflows/prism-v456.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild frozen pattern signals and Seed A
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
          python -m prism.long_patterns_v452
      - name: Evaluate Falling Wedge structural confirmation
        run: python -m prism.structural_reversal_v456
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v456
          test -f results/prism-v456/summary.json || echo '{"status":"FAILED","see":"job logs"}' > results/prism-v456/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v456-structural-reversal
          path: results/prism-v456/
          if-no-files-found: error
