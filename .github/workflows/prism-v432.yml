name: PRISM v4.32 Exit Frontier
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/exit_frontier_v432.py'
      - '.github/workflows/prism-v432.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild frozen VCP80 entries
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
      - name: Compare exit frontier
        run: python -m prism.exit_frontier_v432
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v432
          test -f results/prism-v432/summary.json || echo '{"status":"FAILED","see":"job logs"}' > results/prism-v432/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v432-exit-frontier
          path: results/prism-v432/
          if-no-files-found: error
