name: PRISM C4 Sequential MA 2500
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prism-c4-ma-2500.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PRISM_UNIVERSE_SIZE: '2500'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy requests
      - name: Build 2500 symbol universe
        run: python -m prism.seed_c_discovery_v479
      - name: Compare strict and flexible sequential MA entry
        run: python -m prism.seed_c_c4_2500_v483
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-c4-sequential-ma-v483
          path: results/prism-c4-v483/
          if-no-files-found: error
