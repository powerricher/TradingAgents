name: PRISM v4.70 C1 Regime Risk
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/seed_c_regime_risk_v470.py'
      - '.github/workflows/prism-v470.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy requests
      - name: Rebuild C1 reference
        run: |
          python -m prism.seed_c_discovery_v467
          python -m prism.seed_c_execution_v468
      - name: Compare risk sizing and QQQ market regimes
        run: python -m prism.seed_c_regime_risk_v470
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-v470-c1-regime-risk
          path: results/prism-v470/
          if-no-files-found: error
