name: PRISM v4.25 Opportunity Cost Audit
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/opportunity_v425.py'
      - '.github/workflows/prism-v425.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - run: python -m prism.entry_v413
      - run: python -m prism.replay_v414
      - run: python -m prism.ranking_v417
      - run: python -m prism.price_action_v419
      - run: python -m prism.vcp_v420
      - run: python -m prism.excursion_v424
      - name: Audit held versus missed opportunities
        run: python -m prism.opportunity_v425
      - name: Diagnostic
        if: always()
        run: |
          mkdir -p results/prism-v425
          test -f results/prism-v425/summary.json || echo '{"status":"FAILED","see":"job logs"}' > results/prism-v425/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v425-opportunity-cost
          path: results/prism-v425/
          if-no-files-found: error
