name: PRISM v4.54 Pattern-Aware Exit
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/pattern_aware_exit_v454.py'
      - '.github/workflows/prism-v454.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild frozen v4.53 long pattern candidates
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
          python -m prism.long_patterns_v452
          python -m prism.long_pattern_exits_v453
      - name: Evaluate early failure and staged exit policies
        run: python -m prism.pattern_aware_exit_v454
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v454
          test -f results/prism-v454/summary.json || echo '{"status":"FAILED","see":"job logs"}' > results/prism-v454/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v454-pattern-aware-exit
          path: results/prism-v454/
          if-no-files-found: error
