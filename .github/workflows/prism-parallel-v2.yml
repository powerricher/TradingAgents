name: PRISM Parallel v2 Calibration and Snapshot Validation
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/track_b_baselines.py'
      - 'prism/track_a_seal.py'
      - '.github/workflows/prism-parallel-v2.yml'
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - run: python -m prism.entry_v413
      - run: python -m prism.replay_v414
      - run: python -m prism.ranking_v417
      - run: python -m prism.research_track_b
      - run: python -m prism.track_b_baselines
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-track-b-v2-baselines
          path: results/prism-track-b-v2/
  forward_readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pandas
      - name: Check snapshot sealing CLI
        run: python -m prism.track_a_seal --help
      - name: Readiness marker
        run: |
          mkdir -p results/prism-track-a-v2
          echo '{"status":"SEAL_CLI_READY","live_signal_generator":"NOT_IMPLEMENTED"}' > results/prism-track-a-v2/readiness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-track-a-v2-readiness
          path: results/prism-track-a-v2/
