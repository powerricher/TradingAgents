name: PRISM v4.53 Long Pattern Exit Study
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/long_pattern_exits_v453.py'
      - '.github/workflows/prism-v453.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild frozen v4.52 pattern entries and Seed A
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
          python -m prism.long_patterns_v452
      - name: Compare post-entry paths and exit policies
        run: python -m prism.long_pattern_exits_v453
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v453
          test -f results/prism-v453/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v453/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v453-long-pattern-exits
          path: results/prism-v453/
          if-no-files-found: error
