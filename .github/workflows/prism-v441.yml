name: PRISM v4.41 Seed B Selection
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/seed_b_selection_v441.py'
      - '.github/workflows/prism-v441.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild VCP80 and Seed A ATR4
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
      - name: Evaluate Seed B RS and breakout challengers
        run: python -m prism.seed_b_selection_v441
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v441
          test -f results/prism-v441/summary.json || echo '{"status":"FAILED","see":"job logs"}' > results/prism-v441/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v441-seed-b-selection
          path: results/prism-v441/
          if-no-files-found: error
