name: PRISM v4.23 Long Trend Persistence
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/long_trend_v423.py'
      - '.github/workflows/prism-v423.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - run: python -m prism.entry_v413
      - run: python -m prism.replay_v414
      - run: python -m prism.ranking_v417
      - run: python -m prism.price_action_v419
      - run: python -m prism.vcp_v420
      - name: Compare long trend persistence challenger
        run: python -m prism.long_trend_v423
      - name: Failure diagnostic
        if: always()
        run: |
          mkdir -p results/prism-v423
          test -f results/prism-v423/summary.json || echo '{"status":"FAILED","see":"job logs"}' > results/prism-v423/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v423-long-trend
          path: results/prism-v423/
          if-no-files-found: error
