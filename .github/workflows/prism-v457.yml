name: PRISM v4.57 Strategy Consolidation
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/strategy_consolidation_v457.py'
      - '.github/workflows/prism-v457.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild Seed A and Seed B frozen candidates
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
          python -m prism.regime_adaptive_v436
          python -m prism.seed_b_v445
          python -m prism.technical_quality_v450
      - name: Consolidate strategies and audit concentration
        run: python -m prism.strategy_consolidation_v457
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v457
          test -f results/prism-v457/summary.json || echo '{"status":"FAILED","see":"job logs"}' > results/prism-v457/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v457-strategy-consolidation
          path: results/prism-v457/
          if-no-files-found: error
