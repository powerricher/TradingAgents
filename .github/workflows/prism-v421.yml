name: PRISM v4.21 Three Slot Portfolio
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/portfolio_v421.py'
      - '.github/workflows/prism-v421.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - run: python -m prism.entry_v413
      - run: python -m prism.replay_v414
      - run: python -m prism.ranking_v417
      - run: python -m prism.price_action_v419
      - run: python -m prism.vcp_v420
      - name: Compare one vs three slots
        run: python -m prism.portfolio_v421
      - name: Failure diagnostics
        if: always()
        run: |
          mkdir -p results/prism-v421
          test -f results/prism-v421/summary.json || echo '{"status":"FAILED","see":"job logs"}' > results/prism-v421/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v421-three-slot-portfolio
          path: results/prism-v421/
          if-no-files-found: error
