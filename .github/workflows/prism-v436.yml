name: PRISM v4.36 Regime Adaptive Exit
on:
  workflow_dispatch:
  push:
    branches: [prism-m1]
    paths:
      - 'prism/regime_adaptive_v436.py'
      - '.github/workflows/prism-v436.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prism-m1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install . scikit-learn yfinance pandas numpy
      - name: Rebuild frozen VCP80
        run: |
          python -m prism.entry_v413
          python -m prism.replay_v414
          python -m prism.ranking_v417
          python -m prism.price_action_v419
          python -m prism.vcp_v420
      - name: Compare fixed and dynamic QQQ regimes
        run: python -m prism.regime_adaptive_v436
      - name: Failure diagnostic
        if: always()
        run: |
          mkdir -p results/prism-v436
          test -f results/prism-v436/summary.json || echo '{"status":"FAILED","check":"job logs"}' > results/prism-v436/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-v436-regime-adaptive
          path: results/prism-v436/
          if-no-files-found: error
